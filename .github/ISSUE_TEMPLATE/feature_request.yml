name: Feature request
description: Suggest a workflow or improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What workflow would this improve?
      description: Describe the task and what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include the assistant and native configuration files involved, if relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
